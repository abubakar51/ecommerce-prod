<h3 class="mb-4">All Orders</h3>
<div style="width: 100%;
      margin: auto;">
  <!-- 🔍 Top Bar: Selected Count (Right) + Search -->
  <div
    class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"
  >
    
    <div class="d-flex align-items-center gap-3">
        <span id="selectedCount" style="font-weight: 500">0 selected</span>
      <button id="deleteBtn" class="btn btn-danger">
        Delete Selected
      </button>
    </div> 
    <input
      id="searchInput"
      type="text"
      class="form-control"
      placeholder="Search by mobile..."
      style="max-width: 250px"
    />
  </div>

  <div class="table-responsive">
    <table class="table table-bordered" id="dataTable" style="text-align: center;">
      <thead class="table-light">
        <tr>
          <th style="white-space: nowrap">
            <input type="checkbox" id="selectAll" />
          </th>
          <th style="white-space: nowrap">SL</th>
          <th style="white-space: nowrap">Order ID</th>
          <th style="white-space: nowrap">Customer Name</th>
          <th style="white-space: nowrap">Mobile</th>
          <th style="white-space: nowrap">Product Name</th>
          <th style="white-space: nowrap">Price</th>
          <th style="white-space: nowrap">Quantity</th>
          <th style="white-space: nowrap">Delivery Charge</th>
          <th style="white-space: nowrap">Total Cost</th>
          <th style="white-space: nowrap">Address</th>
          <th style="white-space: nowrap">Status</th>
          <th style="white-space: nowrap">Timer</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 🔽 Bottom Controls: rowPerPage (Left), Delete Button (Right), Pagination (Right) -->
  <div
    class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2"
  >
    <div class="d-flex gap-2 align-items-center">
      <label for="rowsPerPage" style="margin: 0">Rows:</label>
      <select
        id="rowsPerPage"
        class="form-select form-select-sm"
        style="width: auto; min-width: 90px; font-size: 13px; padding: 2px 6px"
      >
        <option value="10" selected>10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="40">40</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </div>

    
      <ul
        id="pagination"
        class="pagination pagination-sm mb-0"
        style="display: flex; list-style: none; padding: 0; margin: 0"
      ></ul>
    </div>
  </div>
</div>

<!-- ✅ Confirm Modal -->
<div
  id="confirmModal"
  class="modal"
  style="
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    justify-content: center;
    align-items: center;
    z-index: 9999;
  "
>
  <div
    class="bg-white p-4 rounded"
    style="width: 300px; background: white; padding: 1rem; border-radius: 8px"
  >
    <p id="confirmMessage">Are you sure?</p>
    <div class="text-end">
      <button class="btn btn-sm btn-secondary" id="confirmNo">No</button>
      <button class="btn btn-sm btn-danger" id="confirmYes">Yes</button>
    </div>
  </div>
</div>
