<div class="container py-4">
  <div class="row g-4">
    <!-- Products -->
    <div
      class="d-item col-12 col-sm-6 col-md-4 col-lg-3"
      data-animate="animate__slideInLeft"
    >
      <div
        class="bg-primary card"
        onmouseover="this.style.boxShadow='0 10px 20px rgba(0,0,0,0.15)';this.style.transform='translateY(-6px)'"
        onmouseout="this.style.boxShadow='0 2px 6px rgba(0,0,0,0.1)';this.style.transform='none'"
      >
        <h3 class="card_header">Products</h3>
        <div class="card_div">
          <h2 class="card_count" id="productCount">--</h2>
        </div>
      </div>
    </div>

    <!-- All Orders -->
    <div
      class="d-item col-12 col-sm-6 col-md-4 col-lg-3"
      data-animate="animate__slideInLeft"
    >
      <div
        class="bg-info card"
        onmouseover="this.style.boxShadow='0 10px 20px rgba(0,0,0,0.15)';this.style.transform='translateY(-6px)'"
        onmouseout="this.style.boxShadow='0 2px 6px rgba(0,0,0,0.1)';this.style.transform='none'"
      >
        <h3 class="card_header">All Orders</h3>
        <div class="card_div">
          <h2 class="card_count" id="orderCount">--</h2>
        </div>
      </div>
    </div>

    <!-- Complete Orders -->
    <div
      class="d-item col-12 col-sm-6 col-md-4 col-lg-3"
      data-animate="animate__slideInRight"
    >
      <div
        class="bg-success card"
        onmouseover="this.style.boxShadow='0 10px 20px rgba(0,0,0,0.15)';this.style.transform='translateY(-6px)'"
        onmouseout="this.style.boxShadow='0 2px 6px rgba(0,0,0,0.1)';this.style.transform='none'"
      >
        <h3 class="card_header">Complete Orders</h3>
        <div class="card_div">
          <h2 class="card_count" id="completeCount">--</h2>
        </div>
      </div>
    </div>

    <!-- Pending Orders -->
    <div
      class="d-item col-12 col-sm-6 col-md-4 col-lg-3"
      data-animate="animate__slideInRight"
    >
      <div
        class="bg-warning card"
        onmouseover="this.style.boxShadow='0 10px 20px rgba(0,0,0,0.15)';this.style.transform='translateY(-6px)'"
        onmouseout="this.style.boxShadow='0 2px 6px rgba(0,0,0,0.1)';this.style.transform='none'"
      >
        <h3 class="card_header">Pending Orders</h3>
        <div class="card_div">
          <h2 class="card_count" id="pendingCount">--</h2>
        </div>
      </div>
    </div>

    <!-- Canceled Orders -->
    <div
      class="d-item col-12 col-sm-6 col-md-4 col-lg-3"
      data-animate="animate__slideInUp"
    >
      <div
        class="bg-danger card"
        onmouseover="this.style.boxShadow='0 10px 20px rgba(0,0,0,0.15)';this.style.transform='translateY(-6px)'"
        onmouseout="this.style.boxShadow='0 2px 6px rgba(0,0,0,0.1)';this.style.transform='none'"
      >
        <h3 class="card_header">Canceled Orders</h3>
        <div class="card_div">
          <h2 class="card_count" id="canceledCount">--</h2>
        </div>
      </div>
    </div>
  </div>
</div>
