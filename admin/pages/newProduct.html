<div class="container py-4">
  <h3 class="mb-4">Add New Product</h3>
  <form id="productForm" enctype="multipart/form-data">
    <div class="mb-3">
      <label for="name" class="form-label">Product Name</label>
      <input type="text" class="form-control" id="name" required />
    </div>
    <div class="mb-3">
      <label for="price" class="form-label">Price (BDT)</label>
      <input type="number" class="form-control" id="price" required />
    </div>
    <div class="mb-3">
      <label for="d_charge" class="form-label">Develery Charge</label>
      <input
        type="number"
        class="form-control"
        id="d_charge"
        placeholder="Optional"
      />
    </div>
    <div class="mb-3">
      <label for="image" class="form-label">Product Image (.jpg only)</label>
      <input
        class="form-control"
        type="file"
        id="image"
        accept=".jpg"
        required
      />
      <div id="imagePreview" class="mt-2"></div>
    </div>
    <button type="submit" class="btn btn-primary">Add Product</button>
  </form>
</div>
<!-- Custom Success Modal -->
<div
  id="customSuccessModal"
  style="
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 9999;
    justify-content: center;
    align-items: center;
  "
>
  <div
    style="
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    "
  >
    <h3 style="margin-top: 0; color: green">✅ Success</h3>
    <p style="margin: 15px 0">New product added successfully!</p>
    <button
      id="closeModalBtn"
      style="
        padding: 6px 16px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      "
    >
      OK
    </button>
  </div>
</div>
