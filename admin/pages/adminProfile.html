<div class="container py-4" style="max-width: 700px">
  <h4 class="mb-5 text-center">Admin Profile</h4>

  <div style="text-align: center; background: #ffffff40">
    <div
      class="text-center mb-4 position-relative"
      style="display: inline-block"
    >
      <img
        id="profilePreview"
        src="/admin/auth/default.jpg"
        class="rounded-circle border"
        style="width: 120px; height: 120px; object-fit: cover"
        alt="Profile Picture"
      />
      <div
        id="hoverOverlay"
        style="
          position: absolute;
          top: 0;
          left: 50%;
          transform: translateX(-50%);
          width: 120px;
          height: 120px;
          background: rgba(0, 0, 0, 0.5);
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.3s ease;
        "
      >
        <i class="bi bi-camera text-white fs-3"></i>
      </div>
      <input type="file" id="profilePicInput" style="display: none" />
    </div>
  </div>

  <form id="adminProfileForm" style="background: #ffffff40">
    <div class="mb-3">
      <label for="adminName" class="form-label">Full Name</label>
      <input type="text" id="adminName" class="form-control" disabled />
    </div>

    <div class="mb-3">
      <label for="adminEmail" class="form-label">Email Address</label>
      <input type="email" id="adminEmail" class="form-control" disabled />
    </div>

    <div class="mb-3">
      <label for="adminUsername" class="form-label">Username</label>
      <input type="text" id="adminUsername" class="form-control" disabled />
    </div>

    <div class="mb-3 position-relative">
      <label for="adminPassword" class="form-label">Password</label>
      <input type="password" id="adminPassword" class="form-control" disabled />
      <i
        class="bi bi-eye-slash"
        id="togglePassword"
        style="position: absolute; top: 36px; right: 10px; cursor: pointer"
      ></i>
    </div>

    <div class="d-flex justify-content-between">
      <button type="button" id="editBtn" class="btn btn-outline-primary">
        <i class="bi bi-pencil"></i> Edit
      </button>
      <button
        type="submit"
        id="saveBtn"
        class="btn btn-success"
        style="display: none"
      >
        <i class="bi bi-check-circle"></i> Save Changes
      </button>
    </div>
  </form>
</div>
