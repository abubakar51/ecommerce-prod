<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Receipt - Sagor Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap");
      * {
        font-family: "Jost", sans-serif !important;
        font-optical-sizing: auto !important;
        font-weight: normal;
        font-style: normal;
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: #f8f9fa;
      }
      .wrapper {
        max-width: 450px;
        margin: 40px auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      img {
        border-radius: 6px;
      }
      .footer {
        text-align: center;
        padding: 20px 0;
        color: #777;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <nav
      class="navbar bg-light px-3 d-flex justify-content-between align-items-center"
    >
      <a href="/home" style="text-decoration: none; color: #333">
        <div id="siteBrand" class="fs-5 d-flex" style="align-items: center">
          Loading...
        </div>
      </a>
    </nav>
    <div class="container wrapper">
      <div id="receipt">
        <h3 class="text-center mb-4">Order Receipt</h3>
        <div class="text-center mb-4" id="productPreview">
          <h3 class="text-center mb-4">Please wait...</h3>
          <!-- Product info here -->
        </div>
        <hr />
        <div id="customerInfo">
          <!-- Customer info here -->
        </div>
      </div>
      <div class="text-center mt-4">
        <button class="btn btn-success" onclick="downloadReceipt()">
          Download Receipt
        </button>
      </div>
    </div>

    <div class="footer">Developed by <strong>Md Sagor Mia</strong></div>

    <!-- JS & PDF libs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      fetch("/api/siteSettings")
        .then((res) => res.json())
        .then(({ success, settings }) => {
          if (!success) return;

          document.title = "Preview Order | " + settings.siteName || "Store";

          // ✅ Favicon
          const favicon = document.createElement("link");
          favicon.rel = "icon";
          favicon.type = "image/png";
          favicon.href = "/api/siteImageGet/favicon";
          document.head.appendChild(favicon);

          // ✅ Brand (Logo / Site Name)
          const showLogo = settings.show_logo === "true";
          const showName = settings.show_site_name === "true";
          const brand = document.getElementById("siteBrand");

          if (showLogo && showName) {
            brand.innerHTML = `<img src="/api/siteImageGet/logo" alt="Logo" style="height: 30px; margin-right: 8px;" /> ${settings.siteName}`;
          } else if (showLogo) {
            brand.innerHTML = `<img src="/api/siteImageGet/logo" alt="Logo" style="height: 30px;" />`;
          } else if (showName) {
            brand.textContent = settings.siteName;
          } else {
            brand.textContent = "";
          }
        });
      const orderId = window.location.pathname.split("/").pop();
      let productData = null;
      let orderData = null;

      async function loadOrderDetails() {
        try {
          const res = await fetch(`/api/orderDetails/${orderId}`);
          const result = await res.json();

          if (!result.success) {
            document.getElementById("receipt").innerHTML =
              "<p class='text-danger text-center'>Order not found</p>";
            return;
          }

          orderData = result.order;
          const products = await fetch("/api/getAllProductsWithImages").then(
            (r) => r.json()
          );
          productData = products.find((p) => p.id === orderData.product_id);

          document.getElementById("productPreview").innerHTML = `
                <img src="/api/productImage/${
                  productData?.id
                }" alt="Product" style="max-width: 200px" />
                <h5 class="mt-3">${
                  productData?.name || "This product is not available"
                }</h5>
                <p><strong>Price:</strong> ${
                  productData?.price || "null"
                } BDT</p>
              `;

          document.getElementById("customerInfo").innerHTML = `
                <p><strong>Order ID:</strong> #${orderData.order_id}</p>
                <p><strong>Product ID:</strong> #${orderData.product_id}</p>
                <p><strong>Quantity:</strong> ${orderData.qty}</p>
                <p><strong>Delivery charge:</strong> ${
                  orderData.d_charge
                } Tk</p>
                <p><strong>Total cost:</strong> ${
                  parseFloat(orderData.p_price) * parseFloat(orderData.qty) +
                  parseFloat(orderData.d_charge)
                } BDT</p>
                <p><strong>Customer Name:</strong> ${orderData.name}</p>
                <p><strong>Mobile:</strong> ${orderData.mobile}</p>
                <p><strong>Address:</strong> ${orderData.address}</p>
                <p><strong>Status:</strong> <span class="badge text-uppercase bg-${
                  orderData.status === "pending"
                    ? "warning"
                    : orderData.status === "complete"
                    ? "success"
                    : "danger"
                }">
        ${orderData.status}
      </span></p>
              `;
        } catch (err) {
          console.error("Failed to load receipt:", err);
        }
      }
      // <span class="text-uppercase badge bg-${
      //               orderData.status === "pending" ? "warning" : "success"
      //             }">${orderData.status}</span>
      async function downloadReceipt() {
        const { jsPDF } = window.jspdf;
        const receipt = document.getElementById("receipt");

        const canvas = await html2canvas(receipt, {
          scale: 3, // 🔻 Lower scale (1.5 is usually enough)
          useCORS: true,
          scrollY: -window.scrollY,
        });

        const imgData = canvas.toDataURL("image/jpeg", 1); // 🔻 JPEG + compression
        const pdf = new jsPDF("p", "mm", "a4");
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pagePadding = 10;
        const usableWidth = pdfWidth - pagePadding * 2;

        const imgProps = pdf.getImageProperties(imgData);
        const imgHeight = (imgProps.height * usableWidth) / imgProps.width;

        // 🔻 Only use necessary height of content
        pdf.internal.pageSize.setHeight(imgHeight + 20); // + some bottom margin
        pdf.addImage(imgData, "JPEG", pagePadding, 10, usableWidth, imgHeight);

        pdf.save(`receipt_${orderId}.pdf`);
      }

      window.addEventListener("DOMContentLoaded", loadOrderDetails);
    </script>
  </body>
</html>
